<!DOCTYPE html>
<html>
<head>
    <meta charset="utf-8" />
    <title>Predicción de frutas y verduras con CLIP</title>
    <style>
        .preview-wrap { margin-top: 1rem; display: none; }
        .preview-wrap.show { display: block; }
        .preview-img {
            max-width: 420px;
            max-height: 320px;
            width: auto;
            height: auto;
            border: 1px solid #ddd;
            border-radius: 8px;
            padding: 6px;
        }
        .file-info { font-size: 0.9rem; color: #555; margin-top: .25rem; }
    </style>
</head>
<body>
    <h1>Sube una imagen de fruta o verdura</h1>

    <form action="/" method="post" enctype="multipart/form-data" id="predict-form">
        <input id="fileInput" type="file" name="file" accept="image/*" required>
        <button type="submit">Predecir</button>

        <!-- Vista previa -->
        <div id="previewWrap" class="preview-wrap {% if preview_url %}show{% endif %}">
            <div class="file-info" id="fileInfo">
                {% if preview_url %}Imagen cargada{% endif %}
            </div>
            <img id="previewImg" class="preview-img" alt="Vista previa"
                 {% if preview_url %}src="{{ preview_url }}"{% endif %}>
        </div>
    </form>

    {% if result %}
        <h2>Predicción principal: {{ result[0] }}</h2>
        <h3>Probabilidades:</h3>
        <ul>
        {% for k, v in result[1].items() %}
            <li>{{ k }}: {{ "%.2f"|format(v * 100) }}%</li>
        {% endfor %}
        </ul>
    {% endif %}

    <script>
        (function () {
            const input = document.getElementById('fileInput');
            const previewWrap = document.getElementById('previewWrap');
            const previewImg = document.getElementById('previewImg');
            const fileInfo = document.getElementById('fileInfo');

            let currentObjectUrl = null;

            function setPreview(file) {
                if (!file) return;
                if (!file.type.startsWith('image/')) {
                    alert('El archivo seleccionado no es una imagen.');
                    input.value = '';
                    return;
                }
                if (currentObjectUrl) URL.revokeObjectURL(currentObjectUrl);
                currentObjectUrl = URL.createObjectURL(file);
                previewImg.src = currentObjectUrl;
                fileInfo.textContent = `${file.name} — ${(file.size/1024).toFixed(1)} KB`;
                previewWrap.classList.add('show');
                // liberar memoria cuando cargue
                previewImg.onload = () => {
                    if (currentObjectUrl) {
                        URL.revokeObjectURL(currentObjectUrl);
                        currentObjectUrl = null;
                    }
                };
            }

            // Vista previa inmediata al seleccionar
            input.addEventListener('change', (e) => {
                const file = e.target.files && e.target.files[0];
                setPreview(file);
            });
        })();
    </script>
</body>
</html>
